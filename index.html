<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCaD Redes</title>
<!-- ==========================================================
   TIPO:      HTML (APP · PWA)
   PROYECTO:  SCaD Redes · APP
   SITIO:     https://redes.scad.mx  (GitHub Pages · repositorio redes)
   ARCHIVO:   index.html  (+ app.js, sw.js, manifest.webmanifest, icons/)
   VERSIÓN:   v1.1.0 · 2026-10-12
   DEPENDE:   scad.mx/sys-autenticacion (app=REDES, token SYS)
              /_functions/redesPwaContext · /_functions/redesTokenRefresh
   VISTAS:    1) Presentación y compra · 2) Acceso al panel ·
              3) Accesos rápidos a las redes de la EO (sesión iniciada)
   ========================================================== -->
<meta name="description" content="Registra, programa y controla las publicaciones de tus marcas en redes sociales.">
<meta name="theme-color" content="#042B62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCaD Redes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#042B62; --orange:#FE6B02; --ink:#141922; --muted:#5D6675; --line:#D5DBE3; --soft:#EEF1F4;
  --panel:#FFFFFF; --bg:#F4F6F9; --live:#C8321F; --ok:#16794A; --warn:#A86200; --r:10px;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.05}
a{color:inherit}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;border-bottom:2px solid var(--navy)}
.top img{height:46px;width:auto;display:block}
.onair{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--live);border:1.5px solid var(--live);padding:1px 7px;border-radius:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:11px 16px;border-radius:var(--r);font-weight:600;text-decoration:none;min-height:46px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);min-height:40px;padding:8px 10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:wait}
.note{background:#FFF7ED;border:1px solid #FED7AA;color:#7C2D12;border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin:14px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
/* Presentación */
.hero{padding:22px 0 8px}
.hero h1{font-size:40px;color:var(--navy)}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p{margin:10px 0 0;color:var(--muted);font-size:16px}
.acts{display:grid;gap:10px;margin:18px 0 6px}
.feats{display:grid;gap:10px;margin:22px 0;padding:0;list-style:none}
.feats li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.feats .ic{width:34px;height:34px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:17px}
.feats b{display:block;font-weight:600}
.feats span{color:var(--muted);font-size:13.5px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 22px}
.price{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.price.main{border-color:var(--navy);box-shadow:inset 0 3px 0 var(--navy)}
.price .n{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.price .p{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--navy);margin:2px 0}
.price .p small{font-size:14px;color:var(--muted);font-weight:500}
.price .d{font-size:13px;color:var(--muted)}
.sec{font-family:var(--f-display);font-size:20px;color:var(--navy);margin:24px 0 8px}
/* EO */
.eo{display:flex;align-items:center;gap:12px;padding:18px 0 6px}
.eo .lg{width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.eo .lg img{max-width:100%;max-height:100%;object-fit:contain}
.eo .lg span{font-family:var(--f-display);font-size:26px;color:var(--navy)}
.eo h1{font-size:30px;color:var(--navy)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:13.5px;color:var(--muted)}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);background:#fff}
.tag.asis{color:var(--warn);border-color:var(--warn)}
.brands{display:grid;gap:12px;margin:18px 0}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.brand header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-left:5px solid var(--c,var(--navy))}
.brand header img{width:34px;height:34px;object-fit:contain;border-radius:6px}
.brand header .dot{width:14px;height:14px;border-radius:50%;background:var(--c,var(--navy));flex:none}
.brand h3{font-size:21px}
.brand .ds{font-size:13px;color:var(--muted)}
.nets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:0 14px 14px}
.net{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;background:#fff}
.net:active{background:var(--soft)}
.net .b{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.empty{text-align:center;padding:26px 14px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
.foot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px}
.ver{text-align:center;font-size:11px;color:#94a3b8;margin-top:18px}
.state{margin:22px 0}
.state h2{font-size:26px;color:var(--navy);margin-bottom:8px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.install{margin:16px 0 4px;border-color:var(--orange);box-shadow:inset 0 3px 0 var(--orange)}
.install h2{font-size:22px;color:var(--navy);margin-bottom:8px}
.install ol{margin:0;padding-left:20px;display:grid;gap:4px}
.install p{margin:0;font-size:14px}
.trial{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;background:var(--orange);border-radius:999px;padding:3px 12px;margin-bottom:10px}
.fine{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 0 0}
.fine a{color:var(--navy);font-weight:600}
.hint{margin:-4px 0 0;font-size:13px;color:var(--muted)}
.promo{margin:18px 0 6px}
.promo video{display:block;width:100%;aspect-ratio:16/9;border-radius:var(--r);background:#E9EDF2;border:1px solid var(--line)}
.promo figcaption{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}
.feats li{display:block;padding:0;border:0;background:none}
.feat{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.feat:active,.price:active{background:var(--soft)}
.ver-mas,.go{font-size:12.5px;font-weight:600;color:var(--orange);white-space:nowrap;align-self:center}
.price{display:flex;flex-direction:column;justify-content:flex-start;width:100%;text-align:left;color:inherit;text-decoration:none;font:inherit;cursor:pointer}
.price .go{display:block;margin-top:auto;padding-top:8px;text-align:left}
.price .p{line-height:1.05}
.price .p small{display:block;margin-top:2px}
.feats .ver-mas,.price .go{color:var(--orange)}
dialog.hoja{width:min(560px,100vw);max-width:100vw;max-height:92vh;margin:auto auto 0;padding:0;border:0;border-radius:16px 16px 0 0;background:var(--panel);color:var(--ink)}
dialog.hoja::backdrop{background:rgba(4,20,45,.55)}
dialog.hoja[open]:not(:modal){position:fixed;inset:auto 0 0 0;z-index:10;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.hoja-top{position:sticky;top:0;display:flex;justify-content:flex-end;padding:8px 8px 0;background:var(--panel)}
.hoja-c{padding:0 18px 22px;display:grid;gap:12px}
.hoja-c h2{font-size:26px;color:var(--navy)}
.hoja-c p{margin:0}
.hoja-c .shot{width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r);display:block}
.pasos{margin:0;padding-left:20px;display:grid;gap:6px}
@media (min-width:600px){dialog.hoja{margin:auto;border-radius:16px}}
@media (max-width:380px){.prices{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="icons/logo.png" alt="SCaD Redes" width="51" height="46">
    <span class="onair" id="onair" hidden>AL AIRE</span>
  </header>

  <main id="view"><div class="loading">Cargando…</div></main>

  <dialog class="hoja" id="hoja" aria-label="Detalle">
    <div class="hoja-top"><button class="btn ghost" data-act="cerrar" type="button" aria-label="Cerrar">✕ Cerrar</button></div>
    <div class="hoja-c" id="hoja-c"></div>
  </dialog>

  <div class="ver">SCaD Redes · <span id="ver"></span> · Powered by SCaD HUB</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
