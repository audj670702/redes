<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>SCaD · Panel SYS</title>

  <style>
    :root {
      --bg: #ffffff;
      --navy: #174b78;
      --navy-hover: #1c5a8f;
      --icon: #e6f0ff;
      --text: #e6f0ff;
      --muted: #8da0bf;
      --focus: rgba(23, 104, 242, .28);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #17223f;
    }

    body {
      padding:
        max(8px, env(safe-area-inset-top))
        8px
        max(10px, env(safe-area-inset-bottom));
    }

    .shell {
      width: 100%;
      max-width: none;
      margin: 0;
    }

    .header {
      margin: 0 0 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 23px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -.035em;
    }

    .version {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .02em;
    }

    /* =========================================================
       BOTONES DE ACCESO
       ========================================================= */

    .systems {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      gap: 0;
      width: 100%;
      padding: 5px;
      background: var(--navy);
      border-radius: var(--radius);
    }

    .system {
      flex: 1 1 0;
      min-width: 0;
      height: 60px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;
      padding: 5px 6px;

      border: 0;
      border-radius: 6px;

      background: transparent;
      color: var(--text);

      text-decoration: none;
      text-align: center;

      cursor: pointer;

      transition:
        background .15s ease,
        transform .15s ease;
    }

    .system:hover {
      background: rgba(255, 255, 255, .09);
      transform: translateY(-1px);
    }

    .system:active {
      transform: translateY(0);
    }

    .system:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* =========================================================
       ICONOS
       ========================================================= */

    .system-icon {
      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--icon);
      flex: 0 0 auto;
    }

    .system-icon svg {
      width: 25px;
      height: 25px;

      display: block;

      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================================================
       NOMBRE
       ========================================================= */

    .system-name {
      width: 100%;

      color: var(--text);
      font-size: 9.5px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Permite dos líneas únicamente cuando el nombre lo requiere */
    .system-name.wrap {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    /* =========================================================
       MÓVIL
       ========================================================= */

    @media (max-width: 520px) {

      body {
        padding-left: 6px;
        padding-right: 6px;
      }

      h1 {
        font-size: 20px;
      }

      .systems {
        gap: 0;
        padding: 4px;
      }

      .system {
        flex: 1 1 0;
        min-width: 0;
        height: 58px;
        padding: 4px 2px;
      }

      .system-icon {
        width: 25px;
        height: 25px;
      }

      .system-icon svg {
        width: 23px;
        height: 23px;
      }

      .system-name {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

      <!-- NEXUS -->

        <path d="M8 12h4"></path>

      <!-- REDES -->
      <symbol id="icon-redes" viewBox="0 0 24 24">

      <!-- RESIDENCIAL -->

        <path d="M9 21v-6h6v6"></path>
      </symbol>

    </defs>
  </svg>

  <!-- =========================================================
       PANEL
       ========================================================= -->

    <header class="header">

      <span class="version">SYS · Panel v1.4.8</span>

    <section

</html>
