<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- SCaD Redes · superposición "Pruébalo sin costo" sobre chroma verde (6 s, 1920x1080).
     Sin sombras, transparencias ni fundidos: solo colores sólidos para un recorte limpio. -->
<style>
:root{--navy:#042B62;--orange:#FE6B02;--key:#00B140}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--key);font-family:Inter,sans-serif}
#g{position:absolute;left:960px;top:800px;width:0;height:0}
.tag{position:absolute;left:0;top:-190px;transform-origin:center;white-space:nowrap;background:var(--navy);color:#fff;
  font-weight:800;font-size:34px;letter-spacing:.06em;padding:12px 26px;border-radius:12px}
.pill{position:absolute;left:0;top:0;transform-origin:center;display:flex;align-items:center;gap:30px;white-space:nowrap;
  background:var(--orange);color:#fff;border:8px solid #fff;border-radius:999px;padding:22px 64px 22px 26px;overflow:hidden}
.pill .ic{width:112px;height:112px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.pill .tx{font-family:"Inter Display",Inter,sans-serif;font-weight:900;font-size:104px;letter-spacing:-.02em;line-height:1}
.pill .tx span{display:inline-block}
.shine{position:absolute;top:-40px;width:70px;height:260px;background:#fff;transform:skewX(-22deg)}
.url{position:absolute;left:0;top:150px;transform-origin:center;white-space:nowrap;background:#fff;color:var(--navy);
  font-weight:800;font-size:40px;padding:12px 30px;border-radius:14px}
.sp{position:absolute;width:44px;height:44px}
</style></head><body>
<div id="g">
  <div class="tag" id="tag">SCaD Redes</div>
  <div class="pill" id="pill">
    <div class="ic"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#FE6B02" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <div class="tx" id="tx"></div>
    <div class="shine" id="shine"></div>
  </div>
  <div class="url" id="url">redes.scad.mx</div>
</div>
<script>
const DUR = 6;
const TXT = 'Pruébalo sin costo';
const tx = document.getElementById('tx');
TXT.split('').forEach(c => { const s = document.createElement('span'); s.textContent = c === ' ' ? ' ' : c; tx.appendChild(s); });
const letters = [...tx.children];
const g = document.getElementById('g');
// destellos (estrellas sólidas) alrededor de la píldora
const SP = [[-720,-90,'#fff'],[700,-110,'#042B62'],[-650,110,'#042B62'],[760,90,'#fff'],[-180,-170,'#FE6B02'],[260,190,'#FE6B02'],[-420,200,'#fff'],[500,-200,'#fff']];
const star = c => `<svg viewBox="0 0 24 24" width="44" height="44"><path fill="${c}" d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg>`;
const sps = SP.map(([x,y,c]) => { const d = document.createElement('div'); d.className='sp'; d.innerHTML = star(c); g.appendChild(d); return {d,x,y}; });

const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
const back = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p-1,3) + c1 * Math.pow(p-1,2); };
const inB = p => p*p*(2.7*p-1.7);
function center(el, s){ el.style.transform = `translate(-50%,-50%) scale(${Math.max(0,s)})`; }

function render(t){
  const out = clamp((t-5.35)/0.5);                     // salida
  const ko = 1 - inB(out);
  // píldora: entra con rebote, luego pulso suave
  const pin = back(clamp((t-0.15)/0.55));
  const pulse = t > 1.6 && t < 5.3 ? 1 + 0.035*Math.sin((t-1.6)*Math.PI*2/1.1) : 1;
  center(document.getElementById('pill'), (t < 0.15 ? 0 : pin) * pulse * ko);
  // letras una por una
  letters.forEach((s,i) => { const p = back(clamp((t-0.35-i*0.03)/0.35)); s.style.transform = `translateY(${(1-p)*60}px) scale(${p})`; });
  // brillo cruzando
  const sh = clamp((t-1.2)/0.55), sh2 = clamp((t-3.6)/0.55);
  const shp = t < 2.5 ? sh : sh2;
  document.getElementById('shine').style.left = (-120 + shp*1400) + 'px';
  // etiqueta superior y URL
  const tag = document.getElementById('tag'); center(tag, back(clamp((t-0.6)/0.45))*ko);
  tag.style.top = '-190px';
  const url = document.getElementById('url'); center(url, back(clamp((t-0.9)/0.45))*ko);
  // destellos: aparecen, giran y desaparecen (por escala)
  sps.forEach((o,i) => {
    const a = clamp((t-0.55-i*0.06)/0.35), b = clamp((t-1.6-i*0.05)/0.35);
    const a2 = clamp((t-3.3-i*0.05)/0.3), b2 = clamp((t-4.2-i*0.05)/0.3);
    const s = Math.max(back(a)*(1-b), back(a2)*(1-b2));
    o.d.style.transform = `translate(${o.x-22}px,${o.y-22}px) rotate(${t*90}deg) scale(${s})`;
  });
}
render(0);
</script></body></html>
